{% load static %}
{% load tailwind_tags %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="sk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThorQA</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    {% tailwind_css %}
    {% htmx_script %}
    <style>
        :root {
            --nav-h: 74px;
            --footer-clear: 70px;
        }
        .hero-photo-left,
        .hero-photo-right {
            object-position: 50% 25%;
        }
        .hero-photo-left { transform: scaleX(-1); }
        .hero-photo-right { transform: none; }
        @media (min-width: 1024px) {
            .hero-photo-left,
            .hero-photo-right {
                object-position: 50% 0%;
                transform-origin: 50% 0%;
            }
            .hero-photo-left { transform: scaleX(-1) scale(1.15); }
            .hero-photo-right { transform: scale(1.15); }
        }
        ::view-transition-old(root),
        ::view-transition-new(root) { animation-duration: 200ms; }
    </style>
</head>
<body class="bg-base-200 text-base-content antialiased font-sans h-dvh overflow-hidden relative flex flex-col justify-between [overscroll-behavior-y:contain]">
    <div class="absolute inset-0 bg-[#151515] z-0"></div>
    <nav id="site-nav" class="absolute top-0 left-0 w-full z-50 px-4 md:px-8 py-5 flex flex-row items-center justify-between bg-[#151515] border-b border-base-300/10 shadow-lg">
        <div data-testid="main-header">
            <a class="text-2xl font-black tracking-wider text-primary">Thor<span class="text-accent">QA</span></a>
        </div>
        <div data-testid="main-buttons">
            <ul class="menu menu-horizontal px-0 font-medium gap-1 sm:gap-2">
                <li><button type="button"
                            class="btn btn-outline btn-sm text-white border-white hover:bg-white hover:text-neutral active:bg-white active:text-neutral active:scale-95 focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none transition-all duration-200 px-2 sm:px-3"
                            hx-get="{% url 'home:home' %}"
                            hx-target="#main-content-container"
                            hx-swap="innerHTML transition:true"
                            hx-push-url="true">Home</button></li>
                <li><button type="button"
                            class="btn btn-outline btn-sm text-white border-white hover:bg-white hover:text-neutral active:bg-white active:text-neutral active:scale-95 focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none transition-all duration-200 px-2 sm:px-3"
                            hx-get="{% url 'about:about' %}"
                            hx-target="#main-content-container"
                            hx-swap="innerHTML transition:true"
                            hx-push-url="true">About</button></li>
                <li><button type="button"
                            class="btn btn-outline btn-sm text-white border-white hover:bg-white hover:text-neutral active:bg-white active:text-neutral active:scale-95 focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none transition-all duration-200 px-2 sm:px-3"
                            hx-get="{% url 'demo:demo' %}"
                            hx-target="#main-content-container"
                            hx-swap="innerHTML transition:true"
                            hx-push-url="true">Demo</button></li>
                <li><button type="button"
                            class="btn btn-primary btn-sm active:scale-95 focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none transition-all duration-200 px-3 sm:px-4"
                            hx-get="{% url 'contact:contact' %}"
                            hx-target="#main-content-container"
                            hx-swap="innerHTML transition:true"
                            hx-push-url="true">Contact</button></li>
            </ul>
        </div>
    </nav>
    <div id="main-content-container" class="flex-1 relative w-full h-full min-h-0" data-testid="main-content-container-block">
        {% block content %}
        {% endblock %}
    </div>
    <footer id="site-footer" class="w-full h-[70px] bg-[#151515] border-t border-b-0 border-base-300/10 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.3)] px-4 md:px-8 flex items-center justify-center fixed bottom-0 left-0 z-50">
        <div class="flex items-center gap-2 text-center" data-testid="footer-element">
            <span class="font-black text-sm tracking-wider text-primary">Thor<span class="text-accent">QA</span></span>
            <span class="text-xs text-neutral-content/40">© {% now "Y" %} - Patrik Hrmo</span>
        </div>
    </footer>
    <script>
    function updateChromeOffsets() {
        const nav = document.getElementById('site-nav');
        const footer = document.getElementById('site-footer');
        if (nav) {
            document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
        }
        if (footer) {
            document.documentElement.style.setProperty('--footer-clear', footer.offsetHeight + 'px');
        }
    }
    updateChromeOffsets();
    window.addEventListener('resize', updateChromeOffsets);
    window.addEventListener('load', updateChromeOffsets);

    let touchStartY = 0;
    let pullDistance = 0;
    const PULL_TO_REFRESH_THRESHOLD = 80; // px of downward pull needed to trigger reload

    window.addEventListener('touchstart', function(e) {
        touchStartY = e.touches[0].clientY;
        pullDistance = 0;
    }, { passive: true });

    window.addEventListener('touchmove', function(e) {
        const touchY = e.touches[0].clientY;
        const scrollBlock = document.querySelector('.overflow-y-auto');

        if (scrollBlock) {
            const isScrollable = scrollBlock.scrollHeight > scrollBlock.clientHeight;
            const isAtTop = scrollBlock.scrollTop === 0;
            const isScrollingDown = touchY > touchStartY;

            if (isScrollable && isAtTop && isScrollingDown) {
                pullDistance = touchY - touchStartY;
                return;
            }
        }

        pullDistance = 0;

        if (!scrollBlock || !scrollBlock.contains(e.target)) {
            e.preventDefault();
        }
    }, { passive: false });

    window.addEventListener('touchend', function() {
        if (pullDistance > PULL_TO_REFRESH_THRESHOLD) {
            window.location.reload();
        }
        pullDistance = 0;
    }, { passive: true });
    </script>
</body>
</html>
